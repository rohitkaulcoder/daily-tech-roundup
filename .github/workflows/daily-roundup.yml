name: Daily Tech Roundup

on:
  workflow_dispatch:  # Triggered externally by cron-job.org
    inputs:
      days:
        description: 'Days to look back'
        required: false
        default: '2'

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Fetch podcast transcripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: python scripts/fetch_podcasts.py --days ${{ inputs.days || '2' }} --max-per-channel 2 -o /tmp/episodes.json

      - name: Generate highlights
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: python scripts/generate_highlights.py --input /tmp/episodes.json --output /tmp/highlights.json

      - name: Check for highlights
        id: check
        run: |
          HIGHLIGHT_COUNT=$(python -c "import json; data=json.load(open('/tmp/highlights.json')); print(sum(len(ep['highlights']) for ep in data))" 2>/dev/null || echo "0")
          echo "highlight_count=$HIGHLIGHT_COUNT" >> $GITHUB_OUTPUT
          echo "Generated $HIGHLIGHT_COUNT highlights"

      - name: Render email
        if: steps.check.outputs.highlight_count != '0'
        run: python scripts/render_email.py --input /tmp/highlights.json --output /tmp/email.html

      - name: Write no-content email
        if: steps.check.outputs.highlight_count == '0'
        run: |
          cat > /tmp/email.html << 'NOCONTENTEOF'
          <!DOCTYPE html>
          <html>
          <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
            <h2 style="color: #1a1a1a;">Daily MTS TBPN TITV Roundup</h2>
            <p style="font-size: 16px; line-height: 1.6;">No new podcast episodes were published today. Check back tomorrow!</p>
            <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 24px 0;">
            <p style="font-size: 12px; color: #999;">This is an automated digest from TBPN, TITV, and MTS Live.</p>
          </body>
          </html>
          NOCONTENTEOF

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/send_email.py --input /tmp/email.html

      - name: Notify failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/failure.html << 'FAILEOF'
          <!DOCTYPE html>
          <html>
          <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
            <h2 style="color: #b91c1c;">Daily Roundup — run failed</h2>
            <p style="font-size: 16px; line-height: 1.6;">The automated roundup did not complete successfully. Check the run logs for details:</p>
            <p><a href="$RUN_URL" style="font-size: 15px; color: #1d4ed8;">Open workflow run</a></p>
          </body>
          </html>
          FAILEOF
          python scripts/send_email.py --input /tmp/failure.html \
            --subject "Daily Roundup FAILED — action needed"
